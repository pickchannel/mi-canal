<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mis canales">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="apple-touch-icon.png">
  <title>Mis canales</title>
  <style>
    :root {
      --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73;
      --accent: #e0245e; --ring: rgba(0,0,0,.08);
      --gap: clamp(12px, 2vw, 20px);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111113; --card: #1c1c1f; --text: #f2f2f4; --muted: #9a9aa2; --ring: rgba(255,255,255,.08); }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-tap-highlight-color: transparent;
    }
    header { padding: var(--gap) var(--gap) 0; display: flex; align-items: baseline; gap: 12px; }
    h1 { font-size: clamp(22px, 3vw, 30px); margin: 0; letter-spacing: -.02em; }
    #count { color: var(--muted); font-size: 14px; }
    #player {
      margin: var(--gap); background: #000; border-radius: 14px; overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }
    #player[hidden] { display: none; }
    #player .frame { position: relative; aspect-ratio: 16 / 9; width: 100%; max-height: 70vh; margin: 0 auto; background: #000; }
    /* Pantalla completa propia (el botón de YouTube se quita) para poder mostrar ◀ ▶ encima del vídeo. */
    #player .frame:fullscreen { aspect-ratio: auto; max-height: none; width: 100%; height: 100%; }
    #player .frame:-webkit-full-screen { aspect-ratio: auto; max-height: none; width: 100%; height: 100%; }
    #player .frame.full { position: fixed; inset: 0; z-index: 10; aspect-ratio: auto; max-height: none; width: auto; height: auto; }
    #player .frame .ov { display: none; position: absolute; z-index: 1; border: 0; color: #fff; background: rgba(0,0,0,.45); font-size: 22px; width: 52px; height: 52px; padding: 0; border-radius: 50%; cursor: pointer; opacity: .75; }
    #player .frame .ov:disabled { opacity: .2; }
    #player .frame:fullscreen .ov, #player .frame:-webkit-full-screen .ov, #player .frame.full .ov { display: block; }
    #ovprev { left: max(16px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); }
    #ovnext { right: max(16px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); }
    #ovexit { right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); font-size: 18px !important; }
    #player iframe { width: 100%; height: 100%; border: 0; display: block; }
    #player .bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: #fff; background: #000; }
    #player .bar #nowdate { flex: none; color: #9a9aa2; font-size: 14px; white-space: nowrap; }
    #player .bar #now { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #player button:disabled { opacity: .35; cursor: default; }
    #player button { appearance: none; border: 0; background: #2a2a2e; color: #fff; border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
    main {
      display: grid; gap: var(--gap); padding: var(--gap);
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
    }
    .card {
      all: unset; display: flex; flex-direction: column; cursor: pointer;
      background: var(--card); border-radius: 14px; overflow: hidden;
      box-shadow: 0 0 0 1px var(--ring); transition: transform .15s ease;
    }
    .card:active { transform: scale(.98); }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .card.playing { box-shadow: 0 0 0 3px var(--accent); }
    .thumbwrap { position: relative; }
    .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.35); }
    .prog span { display: block; height: 100%; background: #f00; }
    .badge { position: absolute; left: 8px; bottom: 10px; background: #cc0000; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .03em; padding: 2px 7px; border-radius: 4px; }
    #suggest { padding: 0 var(--gap); display: flex; flex-direction: column; gap: 18px; }
    #suggest[hidden] { display: none; }
    #suggest h2 { font-size: 18px; margin: 0 0 8px; letter-spacing: -.01em; }
    #suggest .row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 260px); gap: 12px; overflow-x: auto; padding: 3px 3px 6px; scrollbar-width: none; scroll-snap-type: x proximity; }
    #suggest .row .card { scroll-snap-align: start; }
    .thumb { aspect-ratio: 16 / 9; width: 100%; object-fit: cover; display: block; background: var(--ring); }
    .info { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 4px; }
    .title { font-weight: 600; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .date { color: var(--muted); font-size: 13px; }
    #tabs { display: flex; gap: 8px; padding: 12px var(--gap) 0; overflow-x: auto; scrollbar-width: none; }
    #tabs:empty { display: none; }
    #tabs button {
      appearance: none; border: 0; flex: none; cursor: pointer; font: inherit; font-size: 15px; font-weight: 600;
      padding: 8px 16px; border-radius: 999px; background: var(--card); color: var(--text); box-shadow: 0 0 0 1px var(--ring);
    }
    #tabs button[aria-selected="true"] { background: var(--text); color: var(--bg); }
    #sections { display: inline-flex; margin: 12px var(--gap) 0; padding: 3px; border-radius: 999px; background: var(--card); box-shadow: 0 0 0 1px var(--ring); }
    #sections[hidden] { display: none; }
    #sections button {
      appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600;
      padding: 6px 16px; border-radius: 999px; background: transparent; color: var(--muted);
    }
    #sections button[aria-selected="true"] { background: var(--text); color: var(--bg); }
    .msg { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; }
  </style>
</head>
<body>
  <header><h1 id="title">Mis canales</h1><span id="count"></span></header>
  <nav id="tabs" role="tablist"></nav>
  <nav id="sections" role="tablist" hidden>
    <button type="button" role="tab" data-section="video">Vídeos</button>
    <button type="button" role="tab" data-section="live">Directos</button>
  </nav>
  <section id="player" hidden>
    <div class="frame" id="stage"><div id="frame"></div><button class="ov" id="ovprev" type="button" aria-label="Vídeo anterior">◀</button><button class="ov" id="ovnext" type="button" aria-label="Vídeo siguiente">▶</button><button class="ov" id="ovexit" type="button" aria-label="Salir de pantalla completa">✕</button></div>
    <div class="bar"><button id="prev" type="button" aria-label="Vídeo anterior">◀</button><button id="next" type="button" aria-label="Vídeo siguiente">▶</button><span id="now"></span><span id="nowdate"></span><button id="unmute" type="button" hidden>🔇 Activar sonido</button><button id="fs" type="button" aria-label="Pantalla completa">⛶</button><button id="close" type="button">Cerrar</button></div>
  </section>
  <section id="suggest" hidden></section>
  <main id="grid"><p class="msg">Cargando…</p></main>

  <script>
    const $ = (id) => document.getElementById(id);
    const grid = $("grid"), player = $("player");
    const fmt = new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "short", year: "numeric" });
    const fmtApprox = new Intl.DateTimeFormat("es-ES", { month: "short", year: "numeric" });
    const fmtDate = (v) => !v.published ? "" : v.approx ? fmtApprox.format(new Date(v.published)) : fmt.format(new Date(v.published));

    // Historial de reproducción: ◀ vuelve al anterior; ▶ avanza en el historial o, al final, pone el siguiente del canal.
    const HIST_ITEM = "history";
    let hist = (() => { try { return JSON.parse(localStorage.getItem(HIST_ITEM)) || { list: [], pos: -1 }; } catch { return { list: [], pos: -1 }; } })();
    let playing = null;
    const saveHist = () => { try { localStorage.setItem(HIST_ITEM, JSON.stringify(hist)); } catch {} };
    const byId = (id) => (data.videos || []).find((v) => v.id === id);
    const nextInChannel = (video) => {
      const list = (data.videos || []).filter((v) => v.channelId === video.channelId && v.kind === video.kind);
      return list[list.indexOf(video) + 1] || null;
    };

    function markPlaying() {
      document.querySelectorAll(".card").forEach((c) => c.classList.toggle("playing", c.dataset.id === playing?.id));
    }

    function updateArrows() {
      $("prev").disabled = $("ovprev").disabled = hist.pos <= 0;
      $("next").disabled = $("ovnext").disabled = !playing || (hist.pos >= hist.list.length - 1 && !nextInChannel(playing));
    }

    function play(video, fromHistory = false) {
      record();
      if (!fromHistory && hist.list[hist.pos] !== video.id) {
        hist.list = hist.list.slice(0, hist.pos + 1).concat(video.id).slice(-200);
        hist.pos = hist.list.length - 1;
        saveHist();
      }
      playing = video;
      load(video.id);
      $("now").textContent = video.title;
      $("nowdate").textContent = fmtDate(video);
      player.hidden = false;
      renderSuggest();
      markPlaying();
      updateArrows();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function step(dir) {
      for (let p = hist.pos + dir; p >= 0 && p < hist.list.length; p += dir) {
        const v = byId(hist.list[p]);
        if (v) { hist.pos = p; saveHist(); return play(v, true); }
      }
      if (dir > 0 && playing) {
        const v = nextInChannel(playing);
        if (v) play(v);
      }
    }

    $("prev").addEventListener("click", () => step(-1));
    $("ovprev").addEventListener("click", () => step(-1));
    $("ovnext").addEventListener("click", () => step(1));

    // Pantalla completa: la del navegador si existe; si no, el reproductor ocupa toda la ventana.
    const stage = $("stage");
    const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    function enterFull() {
      const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
      if (req) Promise.resolve(req.call(stage)).catch(() => stage.classList.add("full"));
      else stage.classList.add("full");
    }
    function exitFull() {
      if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      stage.classList.remove("full");
    }
    $("fs").addEventListener("click", enterFull);
    $("ovexit").addEventListener("click", exitFull);
    $("next").addEventListener("click", () => step(1));

    // Reproductor con la IFrame API de YouTube: autoplay. Si el navegador bloquea el sonido, arranca en silencio.
    let yt = null;
    const ytReady = new Promise((res) => { window.onYouTubeIframeAPIReady = res; });
    const api = document.createElement("script");
    api.src = "https://www.youtube.com/iframe_api";
    document.head.append(api);

    function checkAutoplay() {
      setTimeout(() => {
        if (!yt || player.hidden) return;
        const st = yt.getPlayerState?.();
        if (st === -1 || st === 5) { yt.mute(); yt.playVideo(); $("unmute").hidden = false; }
      }, 1500);
    }

    // Seguir donde lo dejaste (salvo si ya estaba visto o apenas empezado).
    const startOf = (id) => { const p = prog[id]; return p && !p.done && p.t > 5 ? p.t : 0; };

    function load(id) {
      $("unmute").hidden = true;
      if (yt) { yt.loadVideoById({ videoId: id, startSeconds: startOf(id) }); return checkAutoplay(); }
      ytReady.then(() => {
        if (yt) return yt.loadVideoById({ videoId: playing.id, startSeconds: startOf(playing.id) }), checkAutoplay();
        yt = new YT.Player("frame", {
          host: "https://www.youtube-nocookie.com",
          videoId: playing.id,
          playerVars: { autoplay: 1, rel: 0, playsinline: 1, fs: 0, start: startOf(playing.id) },
          events: {
            onReady: (e) => { e.target.playVideo(); checkAutoplay(); },
            onStateChange: (e) => { if (e.data === 0 || e.data === 2) record(); },
          },
        });
      });
    }

    // Progreso de cada vídeo { t: segundos, d: duración, done, at: cuándo }. Se guarda en el navegador
    // y, si hay SYNC_URL, se sincroniza cifrado con el Worker de Cloudflare (worker/).
    const SYNC_URL = "https://mi-canal-sync.pickchannel.workers.dev";
    const PROG_ITEM = "progress";
    let prog = (() => { try { return JSON.parse(localStorage.getItem(PROG_ITEM)) || {}; } catch { return {}; } })();
    function saveProg() {
      const ids = Object.keys(prog);
      if (ids.length > 3000) ids.sort((a, b) => prog[a].at - prog[b].at).slice(0, ids.length - 3000).forEach((id) => delete prog[id]);
      try { localStorage.setItem(PROG_ITEM, JSON.stringify(prog)); } catch {}
    }

    function setBar(card, p) {
      let bar = card.querySelector(".prog");
      if (!p || !p.d) return bar?.remove();
      if (!bar) { bar = document.createElement("div"); bar.className = "prog"; bar.append(document.createElement("span")); card.querySelector(".thumbwrap").append(bar); }
      bar.firstChild.style.width = (p.done ? 100 : Math.min(100, (p.t / p.d) * 100)) + "%";
    }
    const updateBars = (id) => document.querySelectorAll(".card").forEach((c) => (!id || c.dataset.id === id) && setBar(c, prog[c.dataset.id]));

    let dirty = false;
    function record() {
      if (!yt || !playing || !yt.getDuration) return;
      const t = yt.getCurrentTime(), d = yt.getDuration();
      if (!d || !t) return;
      const done = t / d > 0.95;
      prog[playing.id] = { t: done ? 0 : Math.floor(t), d: Math.round(d), ...(done && { done: 1 }), at: Date.now() };
      saveProg();
      dirty = true;
      updateBars(playing.id);
    }
    setInterval(() => { if (yt?.getPlayerState?.() === 1) record(); }, 5000);

    let syncKey = null, syncPath = null;
    const enc8 = (s) => new TextEncoder().encode(s);
    const b64 = (buf) => {
      const u = new Uint8Array(buf); let s = "";
      for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000));
      return btoa(s);
    };

    async function initSync(pass) {
      if (!SYNC_URL) return;
      const h = await crypto.subtle.digest("SHA-256", enc8("mi-canal-progress-id:" + pass));
      syncPath = [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, "0")).join("");
      const base = await crypto.subtle.importKey("raw", enc8(pass), "PBKDF2", false, ["deriveKey"]);
      syncKey = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: enc8("mi-canal-progress"), iterations: 310000 },
        base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
      await pull();
      setInterval(() => push(), 120000);
    }

    async function pull() {
      if (!syncKey) return;
      try {
        const r = await fetch(`${SYNC_URL}/p/${syncPath}`, { cache: "no-store" });
        const remote = r.ok ? await (async () => {
          const { iv, data } = await r.json();
          const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(iv) }, syncKey, unb64(data));
          return JSON.parse(new TextDecoder().decode(plain));
        })() : {};
        let changed = false;
        for (const [id, p] of Object.entries(remote)) if (!prog[id] || p.at > prog[id].at) { prog[id] = p; changed = true; }
        for (const [id, p] of Object.entries(prog)) if (!remote[id] || p.at > remote[id].at) dirty = true;
        if (changed) { saveProg(); updateBars(); }
      } catch {}
    }

    async function push(keepalive = false) {
      if (!syncKey || !dirty) return;
      if (!keepalive) await pull();
      dirty = false;
      try {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, syncKey, enc8(JSON.stringify(prog)));
        const r = await fetch(`${SYNC_URL}/p/${syncPath}`, { method: "PUT", keepalive, headers: { "content-type": "application/json" }, body: JSON.stringify({ iv: b64(iv), data: b64(data) }) });
        if (!r.ok) dirty = true;
      } catch { dirty = true; }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { record(); push(true); } else pull();
    });

    $("unmute").addEventListener("click", () => { yt?.unMute(); $("unmute").hidden = true; });

    // Sugeridos: todos los canales, uno debajo de otro, con sus vídeos y directos en orden aleatorio.
    const SUGGEST_PER_CHANNEL = 20;
    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function renderSuggest() {
      const box = $("suggest");
      box.replaceChildren();
      const rows = Object.entries(data.channels || {}).flatMap(([id, name]) => [[id, name, false], [id, `${name} - Directos`, true]]);
      for (const [id, name, live] of rows) {
        const list = shuffle((data.videos || []).filter((v) => v.channelId === id && (v.kind === "live") === live && v.id !== playing?.id)).slice(0, SUGGEST_PER_CHANNEL);
        if (!list.length) continue;
        const h = document.createElement("h2");
        h.textContent = name;
        const row = document.createElement("div");
        row.className = "row";
        row.append(...list.map(makeCard));
        const sec = document.createElement("div");
        sec.append(h, row);
        box.append(sec);
      }
      box.hidden = false;
    }

    $("close").addEventListener("click", () => {
      exitFull();
      record();
      push();
      yt?.stopVideo();
      $("unmute").hidden = true;
      $("suggest").hidden = true;
      player.hidden = true;
      playing = null;
      markPlaying();
    });

    let data = { videos: [] };
    // "home" = Inicio (elegir canal). Al abrir la web se empieza siempre en Inicio.
    const HOME = "home";
    let current = HOME;
    function openChannel(id) {
      current = id;
      renderTabs();
      renderGrid();
      window.scrollTo({ top: 0 });
    }

    function renderTabs() {
      const names = data.channels || {};
      const ids = Object.keys(names);
      if (current !== HOME && !ids.includes(current)) current = HOME;
      const tabs = $("tabs");
      tabs.replaceChildren();
      for (const id of [HOME, ...ids]) {
        const b = document.createElement("button");
        b.type = "button";
        b.role = "tab";
        b.textContent = id === HOME ? "Inicio" : names[id];
        b.setAttribute("aria-selected", id === current);
        b.addEventListener("click", () => openChannel(id));
        tabs.append(b);
      }
    }

    function render(json) {
      data = json;
      renderTabs();
      renderGrid();
    }

    let section = "video";
    document.querySelectorAll("#sections button").forEach((b) => b.addEventListener("click", () => {
      section = b.dataset.section;
      renderGrid();
      window.scrollTo({ top: 0 });
    }));

    function makeCard(v) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.dataset.id = v.id;
      if (playing?.id === v.id) card.classList.add("playing");
      const wrap = document.createElement("div");
      wrap.className = "thumbwrap";
      const img = document.createElement("img");
      img.className = "thumb";
      img.loading = "lazy";
      img.alt = "";
      img.src = `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;
      wrap.append(img);
      if (v.kind === "live") {
        const b = document.createElement("span");
        b.className = "badge";
        b.textContent = "DIRECTO";
        wrap.append(b);
      }
      const info = document.createElement("div");
      info.className = "info";
      const t = document.createElement("span");
      t.className = "title";
      t.textContent = v.title;
      const d = document.createElement("span");
      d.className = "date";
      d.textContent = fmtDate(v);
      info.append(t, d);
      card.append(wrap, info);
      setBar(card, prog[v.id]);
      card.addEventListener("click", () => play(v));
      return card;
    }

    // Inicio: una tarjeta por canal (miniatura de su último vídeo) para entrar en él.
    function renderHome() {
      const names = data.channels || {};
      $("title").textContent = document.title = data.title || "Mis canales";
      $("sections").hidden = true;
      const ids = Object.keys(names);
      $("count").textContent = `${ids.length} canales`;
      grid.replaceChildren(...ids.map((id) => {
        const list = (data.videos || []).filter((v) => v.channelId === id);
        const latest = list.reduce((a, v) => (!a || v.published > a.published ? v : a), null);
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        const wrap = document.createElement("div");
        wrap.className = "thumbwrap";
        const img = document.createElement("img");
        img.className = "thumb";
        img.alt = "";
        if (latest) img.src = `https://i.ytimg.com/vi/${latest.id}/hqdefault.jpg`;
        wrap.append(img);
        const info = document.createElement("div");
        info.className = "info";
        const t = document.createElement("span");
        t.className = "title";
        t.textContent = names[id];
        const d = document.createElement("span");
        d.className = "date";
        d.textContent = `${list.length} vídeos${latest ? " · último: " + fmtDate(latest) : ""}`;
        info.append(t, d);
        card.append(wrap, info);
        card.addEventListener("click", () => openChannel(id));
        return card;
      }));
    }

    function renderGrid() {
      if (current === HOME) return renderHome();
      const title = data.channels?.[current] || data.title || "Mis canales";
      $("title").textContent = title;
      document.title = title;
      const ofChannel = (data.videos || []).filter((v) => v.channelId === current).sort((a, b) => b.published.localeCompare(a.published));
      const hasLives = ofChannel.some((v) => v.kind === "live");
      if (!hasLives) section = "video";
      $("sections").hidden = !hasLives;
      document.querySelectorAll("#sections button").forEach((b) => b.setAttribute("aria-selected", b.dataset.section === section));
      const videos = ofChannel.filter((v) => (v.kind === "live") === (section === "live"));
      $("count").textContent = videos.length ? `${videos.length} ${section === "live" ? "directos" : "vídeos"}` : "";
      grid.replaceChildren();
      if (!videos.length) {
        grid.innerHTML = '<p class="msg">Todavía no hay vídeos.</p>';
        return;
      }
      grid.append(...videos.map(makeCard));
    }

    // videos.enc.json = AES-256-GCM, key = PBKDF2-SHA256(passphrase, salt, iter). See scripts/store.mjs.
    const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const KEY_ITEM = "videos-key";
    const getSaved = () => { try { return localStorage.getItem(KEY_ITEM); } catch { return null; } };
    const setSaved = (v) => { try { v ? localStorage.setItem(KEY_ITEM, v) : localStorage.removeItem(KEY_ITEM); } catch {} };

    async function decrypt(enc, passphrase) {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", salt: unb64(enc.salt), iterations: enc.iter },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(enc.iv) }, key, unb64(enc.data));
      return JSON.parse(new TextDecoder().decode(plain));
    }

    function askPassphrase(enc, wrong) {
      $("tabs").replaceChildren();
      $("count").textContent = "";
      grid.innerHTML = `
        <form class="msg" id="unlock" style="display:flex;flex-direction:column;align-items:center;gap:12px">
          <label for="pass">${wrong ? "Contraseña incorrecta. Prueba otra vez:" : "Contraseña:"}</label>
          <input id="pass" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false"
            style="font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--ring);background:var(--card);color:var(--text);width:min(100%,320px)">
          <button type="submit" style="font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:999px;background:var(--text);color:var(--bg);cursor:pointer">Entrar</button>
        </form>`;
      $("pass").focus();
      $("unlock").addEventListener("submit", (e) => {
        e.preventDefault();
        unlock(enc, $("pass").value.trim());
      });
    }

    async function unlock(enc, passphrase) {
      if (!passphrase) return askPassphrase(enc, false);
      grid.innerHTML = '<p class="msg">Abriendo…</p>';
      try {
        const json = await decrypt(enc, passphrase);
        setSaved(passphrase);
        render(json);
        initSync(passphrase);
      } catch {
        setSaved(null);
        askPassphrase(enc, true);
      }
    }

    fetch("videos.enc.json", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((enc) => { const saved = getSaved(); saved ? unlock(enc, saved) : askPassphrase(enc, false); })
      .catch(() => { grid.innerHTML = '<p class="msg">No se pudo cargar la lista de vídeos.</p>'; });
  </script>
</body>
</html>
