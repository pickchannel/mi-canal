<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mis canales">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="apple-touch-icon.png">
  <title>Mis canales</title>
  <style>
    :root {
      --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73;
      --accent: #e0245e; --ring: rgba(0,0,0,.08);
      --gap: clamp(12px, 2vw, 20px);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111113; --card: #1c1c1f; --text: #f2f2f4; --muted: #9a9aa2; --ring: rgba(255,255,255,.08); }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-tap-highlight-color: transparent;
    }
    header { padding: var(--gap) var(--gap) 0; display: flex; align-items: baseline; gap: 12px; }
    h1 { font-size: clamp(22px, 3vw, 30px); margin: 0; letter-spacing: -.02em; }
    #count { color: var(--muted); font-size: 14px; }
    #player {
      position: sticky; top: env(safe-area-inset-top); z-index: 2;
      margin: var(--gap); background: #000; border-radius: 14px; overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }
    #player[hidden] { display: none; }
    #player .frame { aspect-ratio: 16 / 9; width: 100%; max-height: 70vh; margin: 0 auto; }
    #player iframe { width: 100%; height: 100%; border: 0; display: block; }
    #player .bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: #fff; background: #000; }
    #player .bar span { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #player button { appearance: none; border: 0; background: #2a2a2e; color: #fff; border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
    main {
      display: grid; gap: var(--gap); padding: var(--gap);
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
    }
    .card {
      all: unset; display: flex; flex-direction: column; cursor: pointer;
      background: var(--card); border-radius: 14px; overflow: hidden;
      box-shadow: 0 0 0 1px var(--ring); transition: transform .15s ease;
    }
    .card:active { transform: scale(.98); }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .card.playing { box-shadow: 0 0 0 3px var(--accent); }
    .thumb { aspect-ratio: 16 / 9; width: 100%; object-fit: cover; display: block; background: var(--ring); }
    .info { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 4px; }
    .title { font-weight: 600; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .date { color: var(--muted); font-size: 13px; }
    #tabs { display: flex; gap: 8px; padding: 12px var(--gap) 0; overflow-x: auto; scrollbar-width: none; }
    #tabs:empty { display: none; }
    #tabs button {
      appearance: none; border: 0; flex: none; cursor: pointer; font: inherit; font-size: 15px; font-weight: 600;
      padding: 8px 16px; border-radius: 999px; background: var(--card); color: var(--text); box-shadow: 0 0 0 1px var(--ring);
    }
    #tabs button[aria-selected="true"] { background: var(--text); color: var(--bg); }
    .msg { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; }
  </style>
</head>
<body>
  <header><h1 id="title">Mis canales</h1><span id="count"></span></header>
  <nav id="tabs" role="tablist"></nav>
  <section id="player" hidden>
    <div class="frame"><iframe id="frame" title="Reproductor" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div class="bar"><span id="now"></span><button id="close" type="button">Cerrar</button></div>
  </section>
  <main id="grid"><p class="msg">Cargando…</p></main>

  <script>
    const $ = (id) => document.getElementById(id);
    const grid = $("grid"), player = $("player"), frame = $("frame");
    const fmt = new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "short", year: "numeric" });
    const fmtApprox = new Intl.DateTimeFormat("es-ES", { month: "short", year: "numeric" });

    function play(video, card) {
      frame.src = `https://www.youtube-nocookie.com/embed/${video.id}?autoplay=1&rel=0&playsinline=1`;
      $("now").textContent = video.title;
      player.hidden = false;
      document.querySelectorAll(".card.playing").forEach((c) => c.classList.remove("playing"));
      card.classList.add("playing");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    $("close").addEventListener("click", () => {
      frame.src = "about:blank";
      player.hidden = true;
      document.querySelectorAll(".card.playing").forEach((c) => c.classList.remove("playing"));
    });

    let data = { videos: [] };
    let current = (() => { try { return localStorage.getItem("channel"); } catch { return null; } })();

    function renderTabs() {
      const names = data.channels || {};
      const ids = Object.keys(names);
      if (!ids.includes(current)) current = ids[0] || null;
      const tabs = $("tabs");
      tabs.replaceChildren();
      if (ids.length < 2) return;
      for (const id of ids) {
        const b = document.createElement("button");
        b.type = "button";
        b.role = "tab";
        b.textContent = names[id];
        b.setAttribute("aria-selected", id === current);
        b.addEventListener("click", () => {
          current = id;
          try { localStorage.setItem("channel", id); } catch {}
          renderTabs();
          renderGrid();
          window.scrollTo({ top: 0 });
        });
        tabs.append(b);
      }
    }

    function render(json) {
      data = json;
      renderTabs();
      renderGrid();
    }

    function renderGrid() {
      const title = data.channels?.[current] || data.title || "Mis canales";
      $("title").textContent = title;
      document.title = title;
      const videos = (data.videos || []).filter((v) => !current || v.channelId === current);
      $("count").textContent = videos.length ? `${videos.length} vídeos` : "";
      grid.replaceChildren();
      if (!videos.length) {
        grid.innerHTML = '<p class="msg">Todavía no hay vídeos.</p>';
        return;
      }
      for (const v of videos) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        const img = document.createElement("img");
        img.className = "thumb";
        img.loading = "lazy";
        img.alt = "";
        img.src = `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;
        const info = document.createElement("div");
        info.className = "info";
        const t = document.createElement("span");
        t.className = "title";
        t.textContent = v.title;
        const d = document.createElement("span");
        d.className = "date";
        d.textContent = !v.published ? "" : v.approx ? fmtApprox.format(new Date(v.published)) : fmt.format(new Date(v.published));
        info.append(t, d);
        card.append(img, info);
        card.addEventListener("click", () => play(v, card));
        grid.append(card);
      }
    }

    // videos.enc.json = AES-256-GCM, key = PBKDF2-SHA256(passphrase, salt, iter). See scripts/store.mjs.
    const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const KEY_ITEM = "videos-key";
    const getSaved = () => { try { return localStorage.getItem(KEY_ITEM); } catch { return null; } };
    const setSaved = (v) => { try { v ? localStorage.setItem(KEY_ITEM, v) : localStorage.removeItem(KEY_ITEM); } catch {} };

    async function decrypt(enc, passphrase) {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", salt: unb64(enc.salt), iterations: enc.iter },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(enc.iv) }, key, unb64(enc.data));
      return JSON.parse(new TextDecoder().decode(plain));
    }

    function askPassphrase(enc, wrong) {
      $("tabs").replaceChildren();
      $("count").textContent = "";
      grid.innerHTML = `
        <form class="msg" id="unlock" style="display:flex;flex-direction:column;align-items:center;gap:12px">
          <label for="pass">${wrong ? "Contraseña incorrecta. Prueba otra vez:" : "Contraseña:"}</label>
          <input id="pass" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false"
            style="font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--ring);background:var(--card);color:var(--text);width:min(100%,320px)">
          <button type="submit" style="font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:999px;background:var(--text);color:var(--bg);cursor:pointer">Entrar</button>
        </form>`;
      $("pass").focus();
      $("unlock").addEventListener("submit", (e) => {
        e.preventDefault();
        unlock(enc, $("pass").value.trim());
      });
    }

    async function unlock(enc, passphrase) {
      if (!passphrase) return askPassphrase(enc, false);
      grid.innerHTML = '<p class="msg">Abriendo…</p>';
      try {
        const json = await decrypt(enc, passphrase);
        setSaved(passphrase);
        render(json);
      } catch {
        setSaved(null);
        askPassphrase(enc, true);
      }
    }

    fetch("videos.enc.json", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((enc) => { const saved = getSaved(); saved ? unlock(enc, saved) : askPassphrase(enc, false); })
      .catch(() => { grid.innerHTML = '<p class="msg">No se pudo cargar la lista de vídeos.</p>'; });
  </script>
</body>
</html>
